<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — coordinate not found · Aryan Bandyopadhyay</title>
  <meta name="description" content="That page does not exist. Return to the physics portfolio of Aryan Bandyopadhyay." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#060911" />
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="/assets/fonts/instrument-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/assets/fonts/jetbrains-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/assets/css/site.css" />
  <style>
    .nf {
      min-height: 100svh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 2rem 1.25rem;
      position: relative;
      z-index: 1;
    }
    .nf__code {
      font-family: var(--f-mono);
      font-size: 0.68rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--signal);
    }
    .nf__title {
      font-family: var(--f-serif);
      font-size: clamp(2.6rem, 9vw, 5.4rem);
      line-height: 1;
      letter-spacing: -0.03em;
      color: var(--ink);
      margin-top: 1.1rem;
    }
    .nf__title em { font-style: italic; color: var(--signal); }
    .nf__body {
      margin-top: 1.1rem;
      font-size: 0.95rem;
      line-height: 1.7;
      color: var(--ink-3);
      max-width: 30rem;
      margin-inline: auto;
    }
    .nf__readout {
      display: inline-flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.4rem 1.2rem;
      margin-top: 1.8rem;
      padding: 0.6rem 1rem;
      border: 1px solid var(--hairline);
      border-radius: 99px;
      background: var(--surface);
      font-family: var(--f-mono);
      font-size: 0.65rem;
      color: var(--ink-4);
    }
    .nf__readout b { color: var(--amber); font-weight: 500; }
    .nf__actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.55rem;
      margin-top: 1.9rem;
    }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="ambient__grid"></div>
    <div class="ambient__bloom ambient__bloom--a"></div>
    <div class="ambient__bloom ambient__bloom--b"></div>
  </div>

  <main class="nf">
    <div>
      <p class="nf__code">Error 404 · no such coordinate</p>
      <h1 class="nf__title">Out of the <em>depletion region.</em></h1>
      <p class="nf__body">
        The page you asked for does not exist — or it drifted. There is nothing to measure here,
        so the readout below is honestly reporting zero.
      </p>

      <div class="nf__readout" role="status">
        <span>χ² / ndf = <b>—</b></span>
        <span>signal yield = <b>0.0 ± 0.0</b></span>
        <span>significance = <b>0.00σ</b></span>
      </div>

      <div class="nf__actions">
        <a class="btn btn--primary" href="/">Back to the portfolio</a>
        <a class="btn btn--ghost" href="/#research">Research</a>
        <a class="btn btn--quiet" href="/CV_Aryan_Bandyopadhyay.pdf">CV (PDF)</a>
      </div>
    </div>
  </main>
</body>
</html>
