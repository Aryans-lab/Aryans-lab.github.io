<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="Aryan Bandyopadhyay monogram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1728"/>
      <stop offset="1" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
  </defs>
  <rect width="40" height="40" rx="9.2" fill="url(#bg)"/>
  <rect x="0.55" y="0.55" width="38.9" height="38.9" rx="8.7" fill="none" stroke="rgba(148,163,184,0.26)" stroke-width="1.1"/>
  <!-- 'A' rendered as a diffraction peak with a measurement bar -->
  <path d="M11.6 28.9 20 11.4l8.4 17.5" fill="none" stroke="url(#beam)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M15.5 22.9h9" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
  <circle cx="20" cy="11.4" r="2.15" fill="#fbbf24"/>
</svg>
